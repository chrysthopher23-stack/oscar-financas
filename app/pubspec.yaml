name: oscar_financas
description: "Oscar Finanças — Clareza que transforma escolhas em patrimônio."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Nirmala.ttf
    - assets/fonts/NirmalaB.ttf
    - assets/images/oscar_star.webp
    - assets/images/oscar_splash_phone_pt.webp
    - assets/images/oscar_splash_phone_en.webp
    - assets/images/oscar_splash_tablet_pt.webp
    - assets/images/oscar_splash_tablet_en.webp
